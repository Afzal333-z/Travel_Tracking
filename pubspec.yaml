name: travelmate
description: TravelMate - Smart Travel Assistant & Journey Sharing App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Styling
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0

  # State Management
  provider: ^6.1.1

  # Navigation
  go_router: ^13.0.0

  # Charts & Graphs
  fl_chart: ^0.66.0

  # Animations
  lottie: ^3.0.0

  # Date/Time
  intl: ^0.19.0

  # Image Picker (mock)
  image_picker: ^1.0.7

  # Utilities
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets directories (optional, add files as needed)
  assets:
    - assets/images/
    - assets/lottie/
    - assets/mock_data/

  # Note: Fonts are loaded via google_fonts package
  # No local font files needed
